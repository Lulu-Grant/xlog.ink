<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <style>
      .mono { font-family: 'Courier New', ui-monospace, monospace; }
      .term { fill: #1F1E1D; font-size: 13px; }
      .tag  { fill: #C15F3C; font-size: 12px; letter-spacing: 2px; }
      .url  { fill: #5C5650; font-size: 12px; letter-spacing: 1px; }
    </style>
    <clipPath id="bwin"><rect x="70" y="50" width="480" height="380"/></clipPath>
  </defs>

  <!-- 浏览器窗口:0~4s 线条自绘 -->
  <g>
    <rect x="70" y="50" width="480" height="380" rx="6" fill="none" stroke="#1F1E1D" stroke-width="2"
      stroke-dasharray="1730" stroke-dashoffset="1730">
      <animate attributeName="stroke-dashoffset" from="1730" to="0" begin="0.3s" dur="3.6s" fill="freeze"/>
    </rect>
    <line x1="70" y1="84" x2="550" y2="84" stroke="#1F1E1D" stroke-width="2" stroke-dasharray="480" stroke-dashoffset="480">
      <animate attributeName="stroke-dashoffset" from="480" to="0" begin="3.0s" dur="1.2s" fill="freeze"/>
    </line>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/>
      <circle cx="92" cy="67" r="4" fill="#D97757"/>
      <circle cx="110" cy="67" r="4" fill="none" stroke="#C15F3C" stroke-width="1.5"/>
      <circle cx="128" cy="67" r="4" fill="none" stroke="#5C5650" stroke-width="1.5"/>
    </g>
    <rect x="150" y="58" width="320" height="18" rx="3" fill="none" stroke="#5C5650" stroke-width="1" opacity="0">
      <set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/></rect>
    <clipPath id="url0"><rect x="158" y="57" width="0" height="20">
      <animate attributeName="width" values="0;46;94;142;184;210"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="4.5s" dur="2.4s" fill="freeze"/></rect></clipPath>
    <text x="160" y="71" clip-path="url(#url0)" class="mono url">https://xlog.dev <tspan fill="#C15F3C">· building</tspan></text>
  </g>

  <!-- 页面骨架逐块拼装 -->
  <g>
    <rect x="90" y="100" width="440" height="36" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="12.3s" fill="freeze"/></rect>
    <rect x="420" y="110" width="30" height="14" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="13.4s" fill="freeze"/></rect>
    <rect x="458" y="110" width="30" height="14" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="13.8s" fill="freeze"/></rect>
    <rect x="496" y="110" width="24" height="14" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="14.3s" fill="freeze"/></rect>
    <rect x="90" y="152" width="260" height="120" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="16.2s" fill="freeze"/></rect>
    <rect x="370" y="160" width="160" height="10" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="17.4s" fill="freeze"/></rect>
    <rect x="370" y="180" width="138" height="10" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="18.0s" fill="freeze"/></rect>
    <rect x="370" y="200" width="150" height="10" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="18.6s" fill="freeze"/></rect>
    <rect x="370" y="220" width="104" height="10" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="19.2s" fill="freeze"/></rect>
    <rect x="370" y="246" width="92" height="26" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="19.8s" fill="freeze"/></rect>
    <rect x="90" y="292" width="132" height="72" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="20.7s" fill="freeze"/></rect>
    <rect x="244" y="292" width="132" height="72" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="21.6s" fill="freeze"/></rect>
    <rect x="398" y="292" width="132" height="72" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="22.5s" fill="freeze"/></rect>
    <rect x="90" y="386" width="440" height="10" fill="none" stroke="#5C5650" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <set attributeName="opacity" to="1" begin="23.4s" fill="freeze"/></rect>
    <g opacity="0"><set attributeName="opacity" to="1" begin="16.8s" fill="freeze"/>
      <line x1="90" y1="152" x2="350" y2="272" stroke="#5C5650" stroke-width="1"/>
      <line x1="350" y1="152" x2="90" y2="272" stroke="#5C5650" stroke-width="1"/>
    </g>
    
    <rect x="90" y="100" width="440" height="36" fill="#D97757" opacity="0">
      <set attributeName="opacity" to="0.9" begin="25.8s" fill="freeze"/></rect>
    <rect x="370" y="246" width="92" height="26" fill="#D97757" opacity="0">
      <set attributeName="opacity" to="0.9" begin="26.4s" fill="freeze"/></rect>
    <rect x="90" y="292" width="132" height="8" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="26.9s" fill="freeze"/></rect>
    <rect x="244" y="292" width="132" height="8" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="27.2s" fill="freeze"/></rect>
    <rect x="398" y="292" width="132" height="8" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="27.5s" fill="freeze"/></rect>
  </g>

  <!-- 扫描光带:仅在浏览器窗口内往返 -->
  <g clip-path="url(#bwin)">
    <rect x="70" y="86" width="3" height="344" fill="#D97757" opacity="0.45">
      <animate attributeName="x" values="70;547;70" dur="9s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 构建终端:位于浏览器右侧,完全独立不重叠 -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/>
    <rect x="560" y="122" width="230" height="200" fill="none" stroke="#D97757" stroke-width="1.5"/>
    <text x="572" y="134" class="mono tag">┌ BUILD.LOG ┐</text>
    
    <clipPath id="t0"><rect x="572" y="138" width="0" height="20">
      <animate attributeName="width" values="0;33;67;102;132;150"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="6.0s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="152" clip-path="url(#t0)" class="mono term"><tspan fill="#D97757">&gt;</tspan> xlog build <tspan fill="#C15F3C">--web</tspan></text>
    <clipPath id="t1"><rect x="572" y="162" width="0" height="20">
      <animate attributeName="width" values="0;34;69;105;136;155"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="8.7s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="176" clip-path="url(#t1)" class="mono term">compiling <tspan fill="#C15F3C">layout/</tspan> ..</text>
    <clipPath id="t2"><rect x="572" y="186" width="0" height="20">
      <animate attributeName="width" values="0;33;67;102;132;150"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="12.0s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="200" clip-path="url(#t2)" class="mono term">render: header <tspan fill="#D97757">[ok]</tspan></text>
    <clipPath id="t3"><rect x="572" y="210" width="0" height="20">
      <animate attributeName="width" values="0;30;63;95;123;140"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="15.9s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="224" clip-path="url(#t3)" class="mono term">render: hero <tspan fill="#D97757">[ok]</tspan></text>
    <clipPath id="t4"><rect x="572" y="234" width="0" height="20">
      <animate attributeName="width" values="0;31;65;98;127;145"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="20.1s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="248" clip-path="url(#t4)" class="mono term">render: cards <tspan fill="#D97757">[ok]</tspan></text>
    <clipPath id="t5"><rect x="572" y="258" width="0" height="20">
      <animate attributeName="width" values="0;36;74;112;145;165"
        keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" begin="24.6s" dur="2.0s" fill="freeze"/></rect></clipPath>
    <text x="574" y="272" clip-path="url(#t5)" class="mono term"><tspan fill="#C15F3C">optimizing assets ...</tspan></text>
    <rect x="574" y="296" width="198" height="14" fill="none" stroke="#5C5650" stroke-width="1"/>
    <rect x="575" y="297" width="0" height="12" fill="#D97757">
      <animate attributeName="width" values="24;75;133;158;158" keyTimes="0;0.25;0.5;0.75;1"
        calcMode="discrete" begin="6.9s" dur="17.1s" fill="freeze"/>
    </rect>
    
    <text x="770" y="308" text-anchor="end" class="mono term" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="7.0s" fill="freeze"/><set attributeName="opacity" to="0" begin="11.2s" fill="freeze"/>12%</text>
    <text x="770" y="308" text-anchor="end" class="mono term" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="11.2s" fill="freeze"/><set attributeName="opacity" to="0" begin="15.4s" fill="freeze"/>38%</text>
    <text x="770" y="308" text-anchor="end" class="mono term" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="15.4s" fill="freeze"/><set attributeName="opacity" to="0" begin="19.7s" fill="freeze"/>67%</text>
    <text x="770" y="308" text-anchor="end" class="mono term" fill="#C15F3C" opacity="0">
      <set attributeName="opacity" to="1" begin="19.7s" fill="freeze"/>80%</text>
    <rect x="574" y="140" width="8" height="14" fill="#D97757">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;164;188;212;236;260;260" keyTimes="0;0.10;0.22;0.36;0.52;0.68;1"
        calcMode="discrete" begin="6.0s" dur="20s" fill="freeze"/>
    </rect>
  </g>
</svg>