# xlog.ink V2 production hardening (AUDIT-8).
# IMPORTANT: Use SEPARATE server{} blocks — never paste the generated-page CSP
# into the main site server (would break Turnstile / app scripts).
#
#   - xlog.ink / www.xlog.ink  → application (API, admin, Turnstile)
#   - *.xlog.ink (slug hosts) → static generated HTML only + strict CSP
#
# When Cloudflare proxies the site, also include nginx-cloudflare-real-ip.conf
# so quotas, login protection, analytics, and session fallback use the visitor IP.
#
# Production apply notes:
#   1. Backup current vhost conf
#   2. Split listen 80 (redirect) vs 443 apex vs 443 wildcard
#   3. nginx -t && reload
#   4. Verify: partials 404, slug host has CSP, slug host /api 404, http→https

