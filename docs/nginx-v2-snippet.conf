# xlog.ink V2 generated-page hardening.
# Add inside the *.xlog.ink server block after the existing /assets/ allow rule.

location ^~ /site-assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    location ~ \.php$ { return 403; }
}

# Generated subdomain pages: allow inline CSS/JS only for local page effects.
# Images may load from the primary xlog.ink asset host and data URLs.
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https://xlog.ink data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
