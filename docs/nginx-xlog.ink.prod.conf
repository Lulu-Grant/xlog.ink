# xlog.ink — AUDIT-8 hardened (split apex / wildcard, HTTPS force, partials deny)
# Install: /www/server/panel/vhost/nginx/xlog.ink.conf

# ---------- Port 80: ACME + force HTTPS ----------
server
{
    listen 80;
    server_name xlog.ink www.xlog.ink *.xlog.ink;
    root /www/wwwroot/xlog.ink;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/xlog.ink.conf;
    #CERT-APPLY-CHECK--END

    location ~ ^/\.well-known/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/xlog.ink.http.log;
    error_log   /www/wwwlogs/xlog.ink.http.error.log;
}

# ---------- Main application (apex + www) ----------
server
{
    listen 443 ssl http2;
    server_name xlog.ink www.xlog.ink;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/xlog.ink;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/xlog.ink.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/xlog.ink/*.conf;

    #SSL-START
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/xlog.ink/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xlog.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497  https://$host$request_uri;
    #SSL-END

    error_page 404 /404.html;

    location ~ ^/(?:data|includes|prompts|scripts)(?:/|$) {
        return 404;
    }

    # Never serve partials (PHP source leak fix — AUDIT-8 P0-1).
    location ^~ /partials/ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    #PHP-INFO-START
    include enable-php-80.conf;
    #PHP-INFO-END

    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/xlog.ink.conf;
    #REWRITE-END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ^~ /site-assets/ {
        try_files $uri =404;
        location ~ /page-shot\.png$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            location ~ \.php$ { return 403; }
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        location ~ \.php$ { return 403; }
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        access_log  /dev/null;
        error_log  /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        access_log  /dev/null;
        error_log  /dev/null;
    }

    access_log  /www/wwwlogs/xlog.ink.log;
    error_log  /www/wwwlogs/xlog.ink.error.log;
}

# ---------- Generated pages only (slug.xlog.ink) ----------
server
{
    listen 443 ssl http2;
    server_name "~^(?<sub_slug>[A-Za-z0-9](?:[A-Za-z0-9-]{1,18}[A-Za-z0-9])?)\.xlog\.ink$";
    root /www/wwwroot/xlog.ink;

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/xlog.ink/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xlog.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    #SSL-END

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src https://xlog.ink data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        try_files /site/$sub_slug.html =404;
    }

    location ^~ /site-assets/ {
        try_files $uri =404;
        location ~ /page-shot\.png$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            location ~ \.php$ { return 403; }
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        location ~ \.php$ { return 403; }
    }

    location ^~ /api/ { return 404; }
    location = /admin.php { return 404; }
    location ^~ /partials/ { return 404; }
    location ~ ^/(?:data|includes|prompts|scripts)(?:/|$) { return 404; }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    location / {
        return 404;
    }

    access_log  /www/wwwlogs/xlog.ink.pages.log;
    error_log   /www/wwwlogs/xlog.ink.pages.error.log;
}
