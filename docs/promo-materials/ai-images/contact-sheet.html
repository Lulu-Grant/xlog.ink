<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xlog.ink AI atmosphere images</title>
  <style>
    :root {
      --bg: #f2eee6;
      --paper: #f7f3ec;
      --ink: #1f1d1a;
      --line: #cfc6ba;
      --accent: #df7656;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 28px;
    }
    h1 { margin: 0 0 22px; font-size: 26px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 1400px;
    }
    figure {
      margin: 0;
      background: var(--paper);
      border: 3px solid var(--ink);
      padding: 14px;
    }
    img {
      display: block;
      width: 100%;
      height: 340px;
      object-fit: cover;
      border: 2px solid var(--ink);
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-top: 12px;
      font-size: 16px;
      font-weight: 800;
    }
    code { color: var(--accent); font-size: 13px; }
  </style>
</head>
<body>
  <h1>AI atmosphere images / xlog.ink promo</h1>
  <section class="grid">
    <figure><img src="coffee-anniversary-hero.png"><figcaption>01 咖啡店活动 <code>coffee-anniversary-hero.png</code></figcaption></figure>
    <figure><img src="weekend-reading-salon.png"><figcaption>03 活动通知 <code>weekend-reading-salon.png</code></figcaption></figure>
    <figure><img src="personal-brand-workdesk.png"><figcaption>04 个人介绍 <code>personal-brand-workdesk.png</code></figcaption></figure>
    <figure><img src="studio-shop-promo.png"><figcaption>05 小店宣传 <code>studio-shop-promo.png</code></figcaption></figure>
    <figure><img src="music-salon-evening.png"><figcaption>07 活动链接 <code>music-salon-evening.png</code></figcaption></figure>
    <figure><img src="brand-visual-system.png"><figcaption>08 Logo 品牌页 <code>brand-visual-system.png</code></figcaption></figure>
    <figure><img src="social-share-background.png"><figcaption>09 朋友圈宣传 <code>social-share-background.png</code></figcaption></figure>
    <figure><img src="use-case-grid-background.png"><figcaption>10 场景总览 <code>use-case-grid-background.png</code></figcaption></figure>
  </section>
</body>
</html>
